    metadata:
      title_local: "Lietuvos Respublikos švietimo įstatymas"
      title_english: "Law on Education of the Republic of Lithuania"
      publishing_institution: "Parliament of the Republic of Lithuania (Lietuvos Respublikos Seimas)"
      year: 2026
      document_type: "Legislative Act"
      primary_objective: "The law establishes the legal mandate for schools to safeguard and promote student well-being by developing and implementing dedicated health promotion programs. These programs are defined as comprehensive measures aimed at strengthening students' physical and mental health, cultivating healthy lifestyle values, and fostering a health-enhancing school environment (Art. 26(1))."

  - id: LT_DOC_002
    standardized_name: LT_2025_Curriculum_General.pdf
    original_name: AR_2025-11-25.pdf
    transcript_name: LT_2025_Curriculum_General_RAW.md
    metadata:
      title_local: "Priešmokyklinio, pradinio, pagrindinio ir vidurinio ugdymo bendrosios programos"
      title_english: "General Curricula for Pre-primary, Primary, Basic and Secondary Education"
      publishing_institution: "Ministry of Education, Science and Sport of the Republic of Lithuania"
      year: 2025
      document_type: "National Curriculum Framework"
      primary_objective: "Contains the Life Skills General Programme (Gyvenimo įgūdžių bendroji programa) – Annex 48, which constitutes the principal curriculum framework for health education. The programme includes learning outcomes related to physical and mental health, healthy lifestyles, prevention of harmful behaviours, sexuality and relationship education, safety, first aid, and social-emotional competencies."

