      date_of_adoption: "1991-06-25"
      date_of_effect: "1991-07-01"
      publication_source: "Lietuvos aidas, 1991-08-06, Nr. 153-0"
      amendment_version_shown: "Suvestinė redakcija nuo 2026-05-22 iki 2026-08-31"
      url: "https://e-seimas.lrs.lt/portal/legalAct/lt/TAD/TAIS.1480/asr"
      primary_objective: "The law establishes the legal mandate for schools to safeguard and promote student well-being by developing and implementing dedicated health promotion programs. These programs are defined as comprehensive measures aimed at strengthening students' physical and mental health, cultivating healthy lifestyle values, and fostering a health-enhancing school environment (Art. 26(1))."
      chicago_17th_format_notes:
        bibliography_example: "Lithuania. Law on Education of the Republic of Lithuania [Lietuvos Respublikos švietimo įstatymas]. No. I-1489 (June 25, 1991). Lietuvos aidas, no. 153-0 (August 6, 1991). Amended version effective May 22, 2026. https://e-seimas.lrs.lt/portal/legalAct/lt/TAD/TAIS.1480/asr."
        footnote_example: "Law on Education of the Republic of Lithuania, No. I-1489 (June 25, 1991), amended version effective May 22, 2026, https://e-seimas.lrs.lt/portal/legalAct/lt/TAD/TAIS.1480/asr."

