      year: 2026
      document_type: "Legislative Act"
      primary_objective: "The law establishes the legal mandate for schools to safeguard and promote student well-being by developing and implementing dedicated health promotion programs. These programs are defined as comprehensive measures aimed at strengthening students' physical and mental health, cultivating healthy lifestyle values, and fostering a health-enhancing school environment."
