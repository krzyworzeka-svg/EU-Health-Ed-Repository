    metadata:
      title_local: "Priešmokyklinio, pradinio, pagrindinio ir vidurinio ugdymo bendrosios programos"
      title_english: "General Programmes for Pre-primary, Primary, Basic and Secondary Education"
      publishing_institution: "Ministry of Education, Science and Sport of the Republic of Lithuania"
      year: 2025
      document_type: "Legislative Act / National Curriculum Framework"
      primary_objective: "The document establishes 'social, emotional, and healthy lifestyle competence' as a core educational pillar, aiming to equip students with self-awareness, relationship-building skills, and the ability to proactively care for their physical and mental health. Furthermore, it mandates the integration of health and healthy lifestyle as a cross-curricular theme across various subjects to continuously address critical issues such as stress management, safe behavior, and the prevention of harmful habits."

