# Level I: System Overview
education_system:
  framework: "Decree-Law 55/2018 & Citizenship Education (ENEC)"
  model: "Cross-curricular / Citizenship Domains"
  primary_focus: "Health, Environment, and Sustainability as citizenship goals"
  summary: |
    In Portugal, health education is primarily implemented as a transversal and transdisciplinary domain within the "Citizenship and Development" (Cidadania e Desenvolvimento) curriculum component, governed by the National Strategy of Citizenship Education (ENEC, updated in August 2025). Health is a mandatory dimension that schools must address in at least one school year during each major educational cycle (1st cycle, 2nd/3rd cycles, and secondary education). The Portuguese framework covers essential themes such as mental health and violence prevention, food education, physical activity, addictive behaviors, and affective-sexual education. The approach emphasizes active citizenship, the development of socio-emotional skills, systems thinking, and the creation of strong partnerships between schools, families, and local health resources to empower students to make informed, responsible, and safe lifestyle choices.
    However, recent curriculum analyses (such as the 2026 BEACON COST Action report by Carla Sousa) highlight that the Portuguese framework still maintains a predominantly anthropocentric focus. While topics like food systems and environmental factors are included, an integrated 'One Health' approach, linking human, animal, and ecosystem health, is not explicitly conceptualized or operationalized. Furthermore, because specific thematic guidelines (such as the Health and Environmental Education Referentials) function as non-mandatory guiding resources rather than strict curricular prescriptions, the actual implementation of these interconnected health themes remains fragmented and highly dependent on local pedagogical initiatives and individual school choices.

